<!doctype html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ម៉ែ — Read &amp; Dip Info Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Kantumruy+Pro:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FAF9F5; --olive:#5C7034; --light-olive:#88A04D; --dark:#233125; --text-sub:#5F6E60; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0; font-family:"Kantumruy Pro",system-ui,sans-serif; background:var(--cream); color:var(--dark); line-height:1.6; }
  .hero { font-family:"Playfair Display",serif; font-weight:500; letter-spacing:0; line-height:1.15; }
  .tag { display:inline-block; font-size:.7rem; font-weight:600; padding:.15rem .6rem; border-radius:9999px; background:#F0F4E8; color:var(--olive); }
  .card { background:#fff; border:1px solid #E5EADF; border-radius:1.25rem; padding:1.5rem; transition:.2s; }
  .card:hover { border-color:#DDE8F1; box-shadow:0 12px 40px rgba(35,49,37,.06); }
  .card h3 { margin:.5rem 0 .25rem; font-family:"Playfair Display",serif; font-size:1.1rem; font-weight:600; }
  a { color:var(--olive); text-decoration:underline; }
  button { font-family:"Kantumruy Pro",system-ui,sans-serif; }
  /* Do not use letter-spacing or uppercase on Khmer text */
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
